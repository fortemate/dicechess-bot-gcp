name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt --batch 'testOnly *'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assembly:
    name: Fat jar + boot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Build fat jar
        run: sbt --batch assembly
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-run the jar (handshake)
        run: |
          JAR=$(find target/out -type f -name 'dicechess-bot-gcp.jar' -print -quit)
          test -n "$JAR" || (echo "JAR not found" && exit 1)

          LOG="$RUNNER_TEMP/boot-smoke.log"
          DICECHESS_WEBHOOK_SECRET=smoke PORT=8099 java -jar "$JAR" >"$LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          fail() {
            echo "$1"
            echo "--- server output ---"
            cat "$LOG" || true
            exit 1
          }

          # Wait for the JVM to bind the port instead of guessing with a fixed sleep;
          # a loaded runner can need well over three seconds to get there.
          DEADLINE=$((SECONDS + 30))
          until (exec 3<>/dev/tcp/127.0.0.1/8099) 2>/dev/null; do
            kill -0 "$SERVER_PID" 2>/dev/null || fail "server exited before binding port 8099"
            [ "$SECONDS" -lt "$DEADLINE" ] || fail "server did not bind port 8099 within 30s"
            sleep 0.5
          done
          echo "server bound port 8099 after ${SECONDS}s"

          RESPONSE=$(curl -sS --max-time 10 -X POST http://127.0.0.1:8099/api/webhook \
            -H "Content-Type: application/json" \
            -d '{"type":"verification","nonce":"ci-smoke"}') || fail "handshake request failed"
          echo "handshake response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"nonce":"ci-smoke"' || fail "handshake failed"
